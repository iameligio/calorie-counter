<!--
  Full-bleed source. Used for two outputs that must NOT have their own corners:

  - maskable-512.png  — Android applies the platform mask itself. Content sits
    inside the 80%-diameter safe circle (the pulse spans ~51%, so it survives
    the most aggressive circular mask).
  - apple-touch-icon.png — iOS composites transparency onto black, so the
    background has to run edge to edge or the corners show black slivers.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(100 100) scale(13)" fill="none" stroke="#ffffff"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
  </g>
</svg>
