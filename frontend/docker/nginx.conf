server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React SPA — fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml
               application/manifest+json;

    # --- PWA control files -------------------------------------------------
    # These MUST come before the static-asset rule below. An exact-match
    # location outranks a regex one in nginx, which is what keeps sw.js from
    # picking up `expires 1y; immutable` and pinning every existing install to
    # a dead build with no way to recover.
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        expires -1;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # The shell is the update entry point — it references the hashed bundles,
    # so it has to be revalidated or new deploys never reach returning users.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Cache static assets aggressively (Vite adds content hashes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
