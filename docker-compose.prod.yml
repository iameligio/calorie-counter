name: myfitnesspal

# ── Production ─────────────────────────────────────────────────────────────────
# Usage:  make prod-build
#         make prod-up
#
# Single entry point on port 80:
#   http://your-server/         → React frontend
#   http://your-server/api/     → Laravel API
#
# Before first deploy:
#   1. cp backend/.env.production.example backend/.env  and fill in values
#   2. cp .env.example .env  and fill in DB credentials
#   3. make prod-build && make prod-up
#   4. make prod-migrate        (first deploy only)

services:

  api:
    build:
      context: ./backend
      target: production
    env_file: ./backend/.env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [app]

  web:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_BASE_URL: ""
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on: [api]
    networks: [app]

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app]

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks: [app]

volumes:
  db_data:
  redis_data:

networks:
  app:
